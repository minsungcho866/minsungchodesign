<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>억울 포인트</title>
<style>
  :root{
    --bg: #141414;
    --card: #1e1e1e;
    --card-border: #2c2c2c;
    --text: #f2f2f2;
    --sub: #9a9a9a;
    --c1: #6fb3ff; /* 거슬림 */
    --c2: #ffb454; /* 억울함 */
    --c3: #ff5f6d; /* 스트레스 */
    --accent: #ffd166;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  }

  body{
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }

  .wrap{
    width:100%;
    max-width: 480px;
  }

  header{
    text-align:center;
    margin-bottom: 28px;
  }

  header h1{
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }

  header p{
    color: var(--sub);
    font-size: 13px;
    margin:0;
    line-height:1.5;
  }

  .total-card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px 20px;
    text-align:center;
    margin-bottom: 20px;
  }

  .total-label{
    font-size: 12px;
    color: var(--sub);
    letter-spacing: 0.08em;
  }

  .total-score{
    font-size: 48px;
    font-weight: 700;
    margin: 6px 0 14px;
    color: var(--accent);
    transition: transform 0.15s ease;
  }

  .total-score.bump{
    transform: scale(1.12);
  }

  .payback{
    font-size: 14px;
    color: var(--text);
    background: rgba(255,209,102,0.08);
    border: 1px solid rgba(255,209,102,0.25);
    border-radius: 12px;
    padding: 12px 14px;
    line-height:1.5;
  }

  .payback b{
    color: var(--accent);
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-bottom: 22px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    width:100%;
    border: none;
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #141414;
    cursor:pointer;
    text-align:left;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, filter 0.15s ease;
  }

  .btn:active{
    transform: scale(0.98);
  }

  .btn .label{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .btn .desc{
    font-size: 11.5px;
    font-weight: 500;
    opacity: 0.7;
  }

  .btn .pts{
    font-size: 15px;
    font-weight: 800;
    white-space:nowrap;
  }

  .btn.c1{ background: var(--c1); }
  .btn.c2{ background: var(--c2); }
  .btn.c3{ background: var(--c3); color:#fff; }
  .btn.c3 .desc{ opacity:0.85; }

  .log-section{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 16px 6px;
  }

  .log-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 8px;
  }

  .log-header h2{
    font-size: 13px;
    margin:0;
    color: var(--sub);
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .reset-btn{
    background:none;
    border:none;
    color: var(--sub);
    font-size: 12px;
    cursor:pointer;
    text-decoration: underline;
    padding: 4px;
  }

  .reset-btn:hover{ color: var(--c3); }

  .log-list{
    list-style:none;
    margin:0;
    padding:0;
    max-height: 260px;
    overflow-y:auto;
  }

  .log-empty{
    text-align:center;
    color: var(--sub);
    font-size: 13px;
    padding: 20px 0;
  }

  .log-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 10px 0;
    border-bottom: 1px solid var(--card-border);
    font-size: 13px;
    gap: 10px;
  }

  .log-item:last-child{ border-bottom:none; }

  .log-item .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    flex-shrink:0;
  }

  .dot.c1{ background: var(--c1); }
  .dot.c2{ background: var(--c2); }
  .dot.c3{ background: var(--c3); }

  .log-item .info{
    flex:1;
    min-width:0;
  }

  .log-item .cat{
    font-weight: 600;
  }

  .log-item .time{
    color: var(--sub);
    font-size: 11px;
  }

  .log-item .pts{
    font-weight:700;
    color: var(--accent);
    white-space:nowrap;
  }

  .log-item .del{
    background:none;
    border:none;
    color: var(--sub);
    font-size: 16px;
    cursor:pointer;
    padding: 2px 4px;
    line-height:1;
  }

  .log-item .del:hover{ color: var(--c3); }

  footer{
    text-align:center;
    color: var(--sub);
    font-size: 11px;
    margin-top: 24px;
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>억울 포인트</h1>
      <p>안좋은 일이 생길 때마다 눌러서 쌓아두세요.<br>나중에 얼마나 좋은 일이 와야 퉁쳐지는지 알려드립니다.</p>
    </header>

    <div class="total-card">
      <div class="total-label">누적 억울 포인트</div>
      <div class="total-score" id="totalScore">0</div>
      <div class="payback" id="paybackText"></div>
    </div>

    <div class="buttons">
      <button class="btn c1" data-cat="mild" data-pts="10">
        <span class="label">
          조금 거슬리는 일
          <span class="desc">사소하게 짜증났던 순간</span>
        </span>
        <span class="pts">+10</span>
      </button>
      <button class="btn c2" data-cat="unfair" data-pts="30">
        <span class="label">
          적당히 억울한 일
          <span class="desc">나만 손해본 것 같은 일</span>
        </span>
        <span class="pts">+30</span>
      </button>
      <button class="btn c3" data-cat="stress" data-pts="70">
        <span class="label">
          완전 스트레스 받는 일
          <span class="desc">진짜 참기 힘들었던 일</span>
        </span>
        <span class="pts">+70</span>
      </button>
    </div>

    <div class="log-section">
      <div class="log-header">
        <h2>기록</h2>
        <button class="reset-btn" id="resetBtn">전체 초기화</button>
      </div>
      <ul class="log-list" id="logList">
        <li class="log-empty">아직 쌓인 일이 없어요</li>
      </ul>
    </div>

    <footer>기록은 이 브라우저에만 저장됩니다.</footer>
  </div>

<script>
(function(){
  var STORAGE_KEY = 'vibe_unfair_points_log';

  var CATS = {
    mild:   { name: '조금 거슬리는 일', cls: 'c1' },
    unfair: { name: '적당히 억울한 일', cls: 'c2' },
    stress: { name: '완전 스트레스 받는 일', cls: 'c3' }
  };

  var TIERS = [
    { max: 30,   text: '아직 별거 아니에요. <b>커피 한 잔</b> 정도면 바로 퉁쳐집니다.' },
    { max: 80,   text: '<b>맛있는 밥 한 끼</b> 정도는 얻어먹어야 풀릴 것 같아요.' },
    { max: 180,  text: '이 정도면 <b>갖고 싶던 물건 하나</b>는 사야 균형이 맞아요.' },
    { max: 350,  text: '<b>기분 좋은 하루 나들이</b> 정도는 있어야 겨우 비깁니다.' },
    { max: 600,  text: '슬슬 <b>짧은 여행 한 번</b>은 가야 풀릴 레벨이에요.' },
    { max: 1000, text: '<b>제대로 된 여행이나 큰 선물</b> 없이는 안 풀릴 것 같은데요.' },
    { max: Infinity, text: '이건 <b>인생 급의 좋은 일</b>(승진, 합격, 큰 성공)이 와야 겨우 퉁쳐집니다.' }
  ];

  var totalScoreEl = document.getElementById('totalScore');
  var paybackTextEl = document.getElementById('paybackText');
  var logListEl = document.getElementById('logList');
  var resetBtn = document.getElementById('resetBtn');

  function loadLog(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveLog(log){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }catch(e){}
  }

  var log = loadLog();

  function total(){
    return log.reduce(function(sum, item){ return sum + item.pts; }, 0);
  }

  function paybackFor(score){
    for(var i = 0; i < TIERS.length; i++){
      if(score <= TIERS[i].max) return TIERS[i].text;
    }
    return TIERS[TIERS.length - 1].text;
  }

  function formatTime(ts){
    var d = new Date(ts);
    var m = d.getMonth() + 1;
    var day = d.getDate();
    var h = d.getHours();
    var min = d.getMinutes();
    var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
    return m + '/' + day + ' ' + pad(h) + ':' + pad(min);
  }

  function render(){
    var score = total();
    totalScoreEl.textContent = score;
    paybackTextEl.innerHTML = paybackFor(score);

    if(log.length === 0){
      logListEl.innerHTML = '<li class="log-empty">아직 쌓인 일이 없어요</li>';
      return;
    }

    var html = log.slice().reverse().map(function(item){
      var cat = CATS[item.cat];
      return '<li class="log-item" data-id="' + item.id + '">' +
        '<span class="dot ' + cat.cls + '"></span>' +
        '<span class="info">' +
          '<div class="cat">' + cat.name + '</div>' +
          '<div class="time">' + formatTime(item.ts) + '</div>' +
        '</span>' +
        '<span class="pts">+' + item.pts + '</span>' +
        '<button class="del" data-id="' + item.id + '" aria-label="삭제">×</button>' +
      '</li>';
    }).join('');

    logListEl.innerHTML = html;
  }

  function bumpScore(){
    totalScoreEl.classList.remove('bump');
    void totalScoreEl.offsetWidth;
    totalScoreEl.classList.add('bump');
  }

  document.querySelectorAll('.btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var cat = btn.getAttribute('data-cat');
      var pts = parseInt(btn.getAttribute('data-pts'), 10);
      log.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), cat: cat, pts: pts, ts: Date.now() });
      saveLog(log);
      render();
      bumpScore();
    });
  });

  logListEl.addEventListener('click', function(e){
    var target = e.target;
    if(target.classList.contains('del')){
      var id = target.getAttribute('data-id');
      log = log.filter(function(item){ return item.id !== id; });
      saveLog(log);
      render();
    }
  });

  resetBtn.addEventListener('click', function(){
    if(log.length === 0) return;
    if(confirm('쌓아둔 억울 포인트를 전부 지울까요?')){
      log = [];
      saveLog(log);
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
