<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e9e9e9;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
}

/* HERO (TITLE + NAV) */

.hero{
  position:fixed;
  left:18px;
  top:50%;

  transform:translateY(-58%);

  z-index:10;

  max-width:68vw;
}

h1{
  margin:0;

  font-size:11vw;
  line-height:0.88;
  font-weight:900;
  letter-spacing:-0.08em;

  pointer-events:none;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  background:#e9e9e9;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;
}

#intro-text{
  font-size:18px;
  font-weight:900;
  letter-spacing:-2px;
  display:flex;
}

.letter{
  display:inline-block;
}

/* TOP NAV */

.top-nav{
  margin-top:1.6vw;

  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;

  z-index:100;
}

.top-nav a{
  color:#111;
  text-decoration:none;

  font-family:
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;

  font-size:15px;
  font-weight:300;

  transition:opacity .25s ease;
}

.top-nav a:hover{
  opacity:.5;
}

.top-nav .dot{
  color:#111;
  font-size:5px;
}

/* TAGLINE */

.tagline{
  position:fixed;
  bottom:32px;
  left:36px;
  right:36px;

  font-size:clamp(10px, 1.17vw, 13.5px);
  font-weight:500;
  line-height:1.4;
  color:#111;

  z-index:100;
  pointer-events:none;
}

/* CANVAS */

canvas{
  position:absolute;
  inset:0;
  z-index:1;
}

/* MOBILE */

@media(max-width:768px){

  .hero{
    top:20px;
    transform:none;
    max-width:90vw;
  }

  h1{
    font-size:20vw;
  }

  .top-nav{
    margin-top:10px;
    gap:8px;
  }

  .top-nav a{
    font-size:13px;
    white-space:nowrap;
  }

  .tagline{
    font-size:12px;
  }
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div id="intro-text"></div>
</div>

<!-- HERO -->
<div class="hero">

  <h1>MINSUNG</h1>

  <nav class="top-nav">
    <a href="pages/about/index.html">About</a>
    <span class="dot">•</span>
    <a href="pages/projects/index.html">Projects</a>
    <span class="dot">•</span>
    <a href="pages/contact/index.html">Contact</a>
  </nav>

</div>

<!-- TAGLINE -->
<p class="tagline">A collection of observations about people, systems, and the things we choose to spend time on. Some turn into projects, some don't.</p>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

/* SCENE */

const scene = new THREE.Scene();

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  40,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.z = 13;

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
});

renderer.setSize(innerWidth, innerHeight);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

document.body.appendChild(
  renderer.domElement
);

/* GROUP */

const mainGroup = new THREE.Group();

scene.add(mainGroup);

/* SETTINGS */

const images = [
  "imgs/photo1.webp",
  "imgs/photo2.webp",
  "imgs/photo3.webp",
  "imgs/photo4.webp",
  "imgs/photo5.webp",
  "imgs/photo6.webp"
];

const urls = [
  "pages/projects/index.html"
];

const radius = 4.6;
const baseWidth = 4;
const baseHeight = baseWidth * 0.65;
const perRow = 4;

const rowSettings = [
  { y: 4.7, speed: 0.0016, phase: 0 },
  { y: 0, speed: -0.0022, phase: 1.4 },
  { y: -4.7, speed: 0.0019, phase: 2.7 }
];

const rowGroups = [];
const objects = [];

/* ROUNDED TEXTURE */

function createTexture(img){

  const canvas =
    document.createElement("canvas");

  const size = 512;

  canvas.width = size;
  canvas.height = size;

  const ctx =
    canvas.getContext("2d");

  const r = 18;

  ctx.clearRect(0,0,size,size);

  ctx.beginPath();
  ctx.moveTo(r,0);
  ctx.lineTo(size-r,0);
  ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);
  ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);
  ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);
  ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();

  ctx.clip();

  ctx.translate(size,0);
  ctx.scale(-1,1);

  ctx.drawImage(
    img,
    0,
    0,
    size,
    size
  );

  return new THREE.CanvasTexture(canvas);
}

/* CREATE ROWS */

rowSettings.forEach(row=>{

  const rowGroup = new THREE.Group();

  rowGroup.position.y = row.y;

  rowGroup.rotation.y = row.phase;

  mainGroup.add(rowGroup);

  rowGroups.push({
    group: rowGroup,
    speed: row.speed
  });

  const ringImages =
    images.slice(0, perRow);

  ringImages.forEach((src,i)=>{

    const angle =
      (i / ringImages.length)
      * Math.PI * 2;

    const x =
      Math.cos(angle)
      * radius;

    const z =
      Math.sin(angle)
      * radius;

    const geometry =
      new THREE.PlaneGeometry(
        baseWidth,
        baseHeight
      );

    const material =
      new THREE.MeshBasicMaterial({
        color:0xffffff,
        side:THREE.DoubleSide,
        transparent:true,
        depthWrite:false
      });

    const plane =
      new THREE.Mesh(
        geometry,
        material
      );

    plane.position.set(x,0,z);

    plane.lookAt(0,0,0);

    rowGroup.add(plane);

    objects.push(plane);

    const img = new Image();
    img.src = src;

    img.onload = ()=>{

      material.map =
        createTexture(img);

      material.needsUpdate =
        true;
    };
  });
});

/* RAYCAST */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

let hovered = null;

/* HOVER */

renderer.domElement
.addEventListener(
"mousemove",
e=>{

  mouse.x =
    (e.clientX /
    innerWidth)
    * 2 - 1;

  mouse.y =
    -(e.clientY /
    innerHeight)
    * 2 + 1;

  raycaster
    .setFromCamera(
      mouse,
      camera
    );

  const hits =
    raycaster
    .intersectObjects(objects);

  if(hits.length){

    const obj =
      hits[0].object;

    if(hovered !== obj){

      if(hovered){
        hovered.material
        .color
        .set(0xffffff);
      }

      hovered = obj;

      obj.material.color
      .setRGB(
        1.25,
        1.25,
        1.25
      );
    }

  } else if(hovered){

    hovered.material
      .color
      .set(0xffffff);

    hovered = null;
  }
});

/* CLICK */

renderer.domElement
.addEventListener(
"click",
e=>{

  mouse.x =
    (e.clientX /
    innerWidth)
    * 2 - 1;

  mouse.y =
    -(e.clientY /
    innerHeight)
    * 2 + 1;

  raycaster
    .setFromCamera(
      mouse,
      camera
    );

  const hits =
    raycaster
    .intersectObjects(objects);

  if(hits.length){

    const index =
      objects.indexOf(
        hits[0].object
      );

    window.location.href =
      urls[
        index %
        urls.length
      ];
  }
});

/* LAYOUT */

function layout(){

  const isMobile =
    innerWidth < 768;

  mainGroup.position.x =
    isMobile ? 1.44 : 6.84;

  mainGroup.scale
    .setScalar(
      isMobile ? 0.5 : 1
    );
}

layout();

/* ANIMATION */

function animate(){

  requestAnimationFrame(
    animate
  );

  rowGroups.forEach(row=>{

    row.group.rotation.y +=
      row.speed;
  });

  renderer.render(
    scene,
    camera
  );
}

animate();

/* RESIZE */

window
.addEventListener(
"resize",
()=>{

  camera.aspect =
    innerWidth /
    innerHeight;

  camera
    .updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  layout();
});

/* INTRO */

const intro =
document.getElementById(
  "intro"
);

const introText =
document.getElementById(
  "intro-text"
);

const finalText =
"MINSUNG";

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ";

let letters = [];

let frame = 0;
let revealSpeed = 5;

finalText
.split("")
.forEach(()=>{

  const span =
    document
    .createElement(
      "span"
    );

  span.className =
    "letter";

  introText
    .appendChild(
      span
    );

  letters.push(span);
});

function animateIntro(){

  letters.forEach(
  (el,i)=>{

    if(
      i <
      frame /
      revealSpeed
    ){

      el.innerText =
        finalText[i];

      el.style.transform =
        "translateY(0px) scaleY(1)";

    } else {

      el.innerText =
        chars[
          Math.floor(
            Math.random()
            * chars.length
          )
        ];

      const x =
        (Math.random()
        -0.5) * 10;

      const y =
        (Math.random()
        -0.5) * 20;

      el.style.transform =
        `translate(${x}px,${y}px)
        scaleY(${1 +
        Math.random()*0.4})`;
    }

  });

  frame++;

  if(
    frame <
    finalText.length
    * revealSpeed + 15
  ){

    requestAnimationFrame(
      animateIntro
    );

  } else {

    setTimeout(()=>{

      intro.style.transition =
        "opacity .8s ease";

      intro.style.opacity =
        "0";

      setTimeout(()=>{
        intro.remove();
      },800);

    },400);
  }
}

animateIntro();

</script>

</body>
</html>
