<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minsung Cho</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
  /* ----------------- Hamburger ----------------- */
  .hamburger {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 35px;
    height: 30px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .hamburger div {
    width: 100%;
    height: 4px;
    background-color: #23b535;
    border-radius: 2px;
    transition: all 0.3s ease;
  }

  /* Menu open animation */
  .hamburger.active div:nth-child(1) {
    transform: rotate(45deg) translate(7px, 7px);
  }

  .hamburger.active div:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active div:nth-child(3) {
    transform: rotate(-45deg) translate(8px, -8px);
  }

  /* ----------------- Menu ----------------- */
  .menu {
    position: absolute;
    top: 70px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    background: rgba(0,0,0,0.7);
    padding: 15px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 9;
  }

  .menu.show {
    opacity: 1;
    pointer-events: auto;
  }

  .menu a button {
    background-color: transparent;
    color: #fff;
    border: 1px solid #23b535;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    transition: all 0.2s ease;
  }

  .menu a button:hover {
    background-color: #23b535;
    color: #000;
  }
</style>
</head>

<body>

<!-- Title -->
<div class="title">
  <h1>MINSUNG CHO</h1>
</div>

<!-- Hamburger -->
<div class="hamburger" id="hamburger">
  <div></div>
  <div></div>
  <div></div>
</div>

<!-- Menu -->
<div class="menu" id="menu">
  <a href="pages/about/index.html"><button>About</button></a>
  <a href="pages/projects/index.html"><button>Projects</button></a>
  <a href="pages/contact/index.html"><button>Contact</button></a>
</div>

<!-- ----------------- Three.js Globe ----------------- -->
<script type="module">
import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,-0.25,0);

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); // transparent
document.body.appendChild(renderer.domElement);

/* ---------- Lighting ---------- */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
directionalLight.position.set(5,5,5);
scene.add(directionalLight);

/* ---------- Globe group ---------- */
const group = new THREE.Group();
scene.add(group);

/* ---------- Images & URLs ---------- */
const images = [
  "imgs/photo1.webp",
  "imgs/photo2.webp",
  "imgs/photo3.webp",
  "imgs/photo4.webp",
  "imgs/photo5.webp",
  "imgs/photo6.webp"
];

const urls = [
  "projects/project1.html",
  "projects/project2.html",
  "projects/project3.html",
  "projects/project4.html",
  "projects/project5.html",
  "projects/project6.html"
];

const loader = new THREE.TextureLoader();

/* ---------- Globe layout ---------- */
const radius = 2.0;
const latSegments = 10;
const lonSegments = 20;
const baseSize = 0.45;

let imgIndex = 0;

for (let lat=1; lat<latSegments; lat++){
  const theta = lat * Math.PI / latSegments;
  for (let lon=0; lon<lonSegments; lon++){
    const phi = lon * 2 * Math.PI / lonSegments;

    const x = radius * Math.sin(theta) * Math.cos(phi);
    const y = radius * Math.cos(theta);
    const z = radius * Math.sin(theta) * Math.sin(phi);

    const path = images[imgIndex % images.length];
    imgIndex++;

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(baseSize, baseSize),
      new THREE.MeshStandardMaterial({
        side: THREE.DoubleSide,
        color: 0xffffff
      })
    );

    plane.position.set(x,y,z);
    plane.lookAt(0,0,0);
    plane.rotateZ(Math.PI);

    group.add(plane);

    loader.load(path, texture => {
      texture.flipY = false;
      texture.wrapS = THREE.RepeatWrapping;
      texture.repeat.x = -1;

      const img = texture.image;
      const aspect = img.width / img.height;

      plane.geometry.dispose();
      plane.geometry = new THREE.PlaneGeometry(baseSize, baseSize / aspect);

      plane.material.map = texture;
      plane.material.needsUpdate = true;
    });
  }
}

/* ---------- Drag controls ---------- */
let dragging = false;
let lastX=0, lastY=0;

renderer.domElement.addEventListener("mousedown", e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
renderer.domElement.addEventListener("mouseup", () => dragging=false);
renderer.domElement.addEventListener("mouseleave", () => dragging=false);

renderer.domElement.addEventListener("mousemove", e => {
  if(!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  camera.rotation.y -= dx * 0.002;
  camera.rotation.x -= dy * 0.002;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* ---------- Raycaster for click & hover ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredPlane = null;

renderer.domElement.addEventListener("mousemove", e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = - (e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(group.children);

  if(intersects.length>0){
    const plane = intersects[0].object;
    if(hoveredPlane !== plane){
      if(hoveredPlane){
        hoveredPlane.scale.set(1,1,1);
        hoveredPlane.material.color.set(0xffffff);
      }
      hoveredPlane = plane;
      plane.scale.set(1.05,1.05,1.05);
      plane.material.color.set(0xdddddd); // slightly darker on hover
    }
  } else if(hoveredPlane){
    hoveredPlane.scale.set(1,1,1);
    hoveredPlane.material.color.set(0xffffff);
    hoveredPlane = null;
  }
});

/* ---------- Click to open ---------- */
renderer.domElement.addEventListener("click", e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = - (e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(group.children);

  if(intersects.length>0){
    const plane = intersects[0].object;
    const index = group.children.indexOf(plane);
    const url = urls[index % urls.length];
    window.open(url,"_blank");
  }
});

/* ---------- Animation ---------- */
function animate(){
  requestAnimationFrame(animate);
  group.rotation.y += 0.0015;
  renderer.render(scene,camera);
}
animate();

/* ---------- Resize ---------- */
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Hamburger menu toggle ---------- */
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.addEventListener("click", ()=>{
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
});
</script>

</body>
</html>
