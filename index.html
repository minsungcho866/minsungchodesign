<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minsung Cho</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
/* Hamburger */
.hamburger {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 35px;
  height: 30px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hamburger div {
  width: 100%;
  height: 3px;
  background-color: #e3e3e3;
  transition: 0.5s;
}
.hamburger.active div:nth-child(1) {
  transform: rotate(45deg) translate(7px,7px);
}
.hamburger.active div:nth-child(2) { opacity: 0; }
.hamburger.active div:nth-child(3) {
  transform: rotate(-45deg) translate(8px,-8px);
}

/* Menu */
.menu {
  position: absolute;
  top: 70px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: rgba(0,0,0);
  padding: 15px;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 8px;
}
.menu.show {
  opacity: 1;
  pointer-events: auto;
}
.menu button {
  background: transparent;
  color: white;
  border: none;
  cursor: pointer;
}
.menu button:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="title">
  <h1>MINSUNG CHO</h1>
</div>

<div class="hamburger" id="hamburger">
  <div></div><div></div><div></div>
</div>

<div class="menu" id="menu">
  <a href="pages/about/index.html"><button>About</button></a>
  <a href="pages/projects/index.html"><button>Projects</button></a>
  <a href="pages/contact/index.html"><button>Contact</button></a>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

/* Detect mobile */
const isMobile = window.innerWidth < 768;

/* Scene */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.1,
  1000
);
camera.position.set(0, -0.25, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: !isMobile,
  alpha: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dir = new THREE.DirectionalLight(0xffffff, 0.5);
dir.position.set(5,5,5);
scene.add(dir);

/* Group */
const group = new THREE.Group();
scene.add(group);

const rows = [];

/* Images */
const images = [
  "imgs/photo1.webp","imgs/photo2.webp","imgs/photo3.webp",
  "imgs/photo4.webp","imgs/photo5.webp","imgs/photo6.webp",
];

const urls = [
  "pages/projects/index.html"
];

const loader = new THREE.TextureLoader();

/* Globe settings (optimized) */
const radius = 2;
const latSegments = isMobile ? 6 : 10;
const lonSegments = isMobile ? 12 : 20;

const baseWidth = 0.45;
const baseHeight = baseWidth * 9/16;

let imgIndex = 0;

/* Store all objects once (for raycasting) */
const objects = [];

/* Create globe */
for(let lat=1; lat<latSegments; lat++){
  const rowGroup = new THREE.Group();
  group.add(rowGroup);
  rows.push(rowGroup);

  const theta = lat * Math.PI / latSegments;

  for(let lon=0; lon<lonSegments; lon++){
    const phi = lon * 2 * Math.PI / lonSegments;

    const x = radius*Math.sin(theta)*Math.cos(phi);
    const y = radius*Math.cos(theta);
    const z = radius*Math.sin(theta)*Math.sin(phi);

    const material = new THREE.MeshStandardMaterial({
      side: THREE.DoubleSide,
      color: 0xaaaaaa
    });

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(baseWidth, baseHeight),
      material
    );

    plane.position.set(x,y,z);
    plane.lookAt(0,0,0);

    rowGroup.add(plane);
    objects.push(plane);

    const path = images[imgIndex % images.length];
    imgIndex++;

    loader.load(path, tex=>{
      tex.flipY = true;
      material.map = tex;
      material.needsUpdate = true;
    });
  }
}

/* Drag */
let dragging=false, lastX=0,lastY=0;

renderer.domElement.addEventListener("mousedown",e=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY;
});
renderer.domElement.addEventListener("mouseup",()=>dragging=false);
renderer.domElement.addEventListener("mouseleave",()=>dragging=false);

renderer.domElement.addEventListener("mousemove",e=>{
  if(!dragging) return;
  camera.rotation.y -= (e.clientX-lastX)*0.002;
  camera.rotation.x -= (e.clientY-lastY)*0.002;
  lastX=e.clientX; lastY=e.clientY;
});

/* Raycaster (optimized) */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered=null;
let lastMoveTime = 0;

renderer.domElement.addEventListener("mousemove",e=>{
  const now = performance.now();
  if(now - lastMoveTime < 50) return;
  lastMoveTime = now;

  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(objects);

  if(hits.length){
    const p = hits[0].object;

    if(hovered !== p){
      if(hovered){
        hovered.scale.set(1,1,1);
        hovered.material.color.set(0xaaaaaa);
      }
      hovered = p;
      p.scale.set(1.05,1.05,1.05);
      p.material.color.set(0xffffff);
    }
  } else if(hovered){
    hovered.scale.set(1,1,1);
    hovered.material.color.set(0xaaaaaa);
    hovered = null;
  }
});

/* Click */
renderer.domElement.addEventListener("click",e=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(objects);

  if(hits.length){
    const index = objects.indexOf(hits[0].object);
    window.open(urls[index % urls.length],"_blank");
  }
});

/* Animation */
function animate(){
  requestAnimationFrame(animate);

  rows.forEach((row,i)=>{
    const dir = i % 2 === 0 ? 1 : -1;
    row.rotation.y += 0.001 * dir;
  });

  renderer.render(scene,camera);
}
animate();

/* Resize */
window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* Menu */
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = ()=>{
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};
</script>

</body>
</html>
