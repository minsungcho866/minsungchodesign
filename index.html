<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minsung Cho</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
/* Hamburger */
.hamburger {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 35px;
  height: 30px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hamburger div {
  width: 100%;
  height: 3px;
  background-color: #e3e3e3;
  transition: 0.5s;
}
.hamburger.active div:nth-child(1) {
  transform: rotate(45deg) translate(7px,7px);
}
.hamburger.active div:nth-child(2) { opacity: 0; }
.hamburger.active div:nth-child(3) {
  transform: rotate(-45deg) translate(8px,-8px);
}

/* Menu */
.menu {
  position: absolute;
  top: 70px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: rgba(0,0,0);
  padding: 15px;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 8px;
}
.menu.show {
  opacity: 1;
  pointer-events: auto;
}
.menu button {
  background: transparent;
  color: white;
  border: none;
  cursor: pointer;
}
.menu button:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="title">
  <h1>MINSUNG CHO</h1>
</div>

<div class="hamburger" id="hamburger">
  <div></div><div></div><div></div>
</div>

<div class="menu" id="menu">
  <a href="pages/about/index.html"><button>About</button></a>
  <a href="pages/projects/index.html"><button>Projects</button></a>
  <a href="pages/contact/index.html"><button>Contact</button></a>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

/* Scene */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.1,
  1000
);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff, 1));

/* Group */
const group = new THREE.Group();
scene.add(group);

/* Images */
const images = [
  "imgs/photo1.webp","imgs/photo2.webp","imgs/photo3.webp",
  "imgs/photo4.webp","imgs/photo5.webp","imgs/photo6.webp",
];

const urls = [
  "pages/projects/index.html"
];

const loader = new THREE.TextureLoader();

/* Ring settings */
const radius = 3;
const count = images.length;

/* 2x bigger */
const baseWidth = 0.7;
const baseHeight = baseWidth * 9/16;

const objects = [];

/* Create circular ring */
for(let i = 0; i < count; i++){

  const angle = (i / count) * Math.PI * 2;

  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;

  const material = new THREE.MeshBasicMaterial({
    side: THREE.DoubleSide,
    color: 0xaaaaaa
  });

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(baseWidth, baseHeight),
    material
  );

  plane.position.set(x, 0, z);

  /* Face center */
  plane.lookAt(0, 0, 0);

  group.add(plane);
  objects.push(plane);

  loader.load(images[i], tex=>{
    tex.flipY = true;

      // 👇 ADD THIS
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.x = -1;
  
    material.map = tex;
    material.needsUpdate = true;

    
  });
}

/* Raycaster */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;

renderer.domElement.addEventListener("mousemove", e=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(objects);

  if(hits.length){
    const p = hits[0].object;

    if(hovered !== p){
      if(hovered){
        hovered.scale.set(1,1,1);
        hovered.material.color.set(0xaaaaaa);
      }
      hovered = p;
      p.scale.set(1.1,1.1,1.1);
      p.material.color.set(0xffffff);
    }
  } else if(hovered){
    hovered.scale.set(1,1,1);
    hovered.material.color.set(0xaaaaaa);
    hovered = null;
  }
});

/* Click */
renderer.domElement.addEventListener("click", e=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(objects);

  if(hits.length){
    const index = objects.indexOf(hits[0].object);
    window.open(urls[index % urls.length], "_blank");
  }
});

/* Animate (single rotation) */
function animate(){
  requestAnimationFrame(animate);

  group.rotation.y += 0.003;

  renderer.render(scene, camera);
}
animate();

/* Resize */
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* Menu */
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = ()=>{
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};
</script>

</body>
</html>
