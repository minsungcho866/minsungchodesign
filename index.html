<script type="module">
import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

/* ---------- Scene ---------- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 0, 0);

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

/* ---------- Globe group ---------- */
const group = new THREE.Group();
scene.add(group);

/* ---------- Images ---------- */
const images = [
  "imgs/photo1.webp",
  "imgs/photo2.webp",
  "imgs/photo3.webp",
  "imgs/photo4.webp",
  "imgs/photo5.webp",
  "imgs/photo6.webp"
];

const loader = new THREE.TextureLoader();

/* ---------- Globe configuration ---------- */
const radius = 2.0;
const latSegments = 10;
const lonSegments = 20;
const baseSize = 0.45;

let imgIndex = 0;

/* ---------- Generate globe panels ---------- */
for (let lat = 1; lat < latSegments; lat++) {
  const theta = lat * Math.PI / latSegments;

  for (let lon = 0; lon < lonSegments; lon++) {
    const phi = lon * 2 * Math.PI / lonSegments;

    const x = radius * Math.sin(theta) * Math.cos(phi);
    const y = radius * Math.cos(theta);
    const z = radius * Math.sin(theta) * Math.sin(phi);

    const path = images[imgIndex % images.length];
    imgIndex++;

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(baseSize, baseSize),
      new THREE.MeshBasicMaterial({
        side: THREE.DoubleSide,
        color: 0x333333
      })
    );

    plane.position.set(x, y, z);
    plane.lookAt(0, 0, 0);
    plane.rotateZ(Math.PI);

    group.add(plane);

    /* ---------- Load texture ---------- */
    loader.load(path, texture => {

      texture.flipY = false;

      texture.wrapS = THREE.RepeatWrapping;
      texture.repeat.x = -1;

      const img = texture.image;
      const aspect = img.width / img.height;

      plane.geometry.dispose();
      plane.geometry = new THREE.PlaneGeometry(baseSize, baseSize / aspect);

      plane.material.map = texture;
      plane.material.color.set(0xffffff);
      plane.material.needsUpdate = true;
    });
  }
}

/* ---------- Drag controls ---------- */
let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("mousedown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener("mouseup", () => dragging = false);
renderer.domElement.addEventListener("mouseleave", () => dragging = false);

renderer.domElement.addEventListener("mousemove", e => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  camera.rotation.y -= dx * 0.002;
  camera.rotation.x -= dy * 0.002;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* ---------- Animation ---------- */
function animate() {
  requestAnimationFrame(animate);
  group.rotation.y += 0.0015;
  renderer.render(scene, camera);
}
animate();

/* ---------- Resize ---------- */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
