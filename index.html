<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e9e9e9;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
}

/* -----------------------
   BACKSIDE FLIP
----------------------- */

.stage{
  position:relative;
  width:100%;
  height:100vh;
  perspective:2400px;
}

.flipper{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.65,0,.35,1);
  transform:rotateX(0deg);
}

.flipper.flipped{
  transform:rotateX(-180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
}

.face.front{
  background:#e9e9e9;
}

.face.front.content-hidden{
  visibility:hidden;
}

.face.back{
  background:#0a0a0a;
  color:#c9c6bd;

  font-family:"ocr-a-std", monospace;
  font-weight:400;
  font-style:normal;

  overflow:hidden;

  transform:rotateX(180deg);
}

.mind-scene{
  position:relative;
  width:100%;
  height:100%;
  perspective:1800px;
}

.mind-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate3d(-50%,-50%,0);

  z-index:30;
  max-width:520px;
  padding:0 24px;

  pointer-events:none;
}

.back-text{
  font-size:clamp(11px,1.3vw,14px);
  font-weight:400;
  line-height:1.7;
  text-align:center;
  margin:0;
}

.mind-card{
  position:absolute;
  top:var(--t);
  left:var(--l);
  width:var(--w);

  transform:
    translate3d(-50%,-50%,0)
    translate3d(var(--px,0px),var(--py,0px),var(--z));
  transition:transform .6s cubic-bezier(.22,.9,.32,1);

  cursor:pointer;
  will-change:transform;
}

.mind-card-image{
  position:relative;
  overflow:hidden;
  box-shadow:0 22px 46px rgba(0,0,0,.5);
}

.mind-card-image img{
  display:block;
  width:100%;
  height:auto;

  filter:grayscale(40%) brightness(.88);
  transition:filter .4s ease;
}

.mind-card:hover .mind-card-image img,
.mind-card.is-active .mind-card-image img{
  filter:grayscale(0%) brightness(1);
}

.mind-card-info{
  position:absolute;
  inset:auto 0 0 0;
  padding:10px 12px 8px;

  background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));

  text-align:left;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
}

.mind-card:hover .mind-card-info,
.mind-card.is-active .mind-card-info{
  opacity:1;
  transform:translateY(0);
}

.mind-card-title{
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
  text-transform:uppercase;
  margin:0 0 4px;
}

.mind-card-year{
  font-size:9px;
  opacity:.55;
  margin:0 0 6px;
}

.mind-card-desc{
  font-size:9px;
  line-height:1.55;
  opacity:.75;
  margin:0;

  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.flip-toggle{
  position:fixed;
  top:26px;
  left:28px;

  z-index:500;

  appearance:none;
  border:1px solid rgba(17,17,17,.4);
  background:transparent;
  color:#111;

  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;

  padding:5px 11px;
  border-radius:999px;
  cursor:pointer;

  transition:opacity .2s ease, color .3s ease, border-color .3s ease;
}

.flip-toggle:hover{
  opacity:.6;
}

.flip-toggle.is-back{
  border-color:rgba(201,198,189,.5);
  color:#c9c6bd;
}

/* HERO (TITLE + NAV) */

.hero{
  position:absolute;
  left:64px;
  top:50%;

  transform:translateY(-58%);

  z-index:10;

  max-width:68vw;
}

h1{
  margin:0;

  font-size:11vw;
  line-height:0.88;
  font-weight:900;
  letter-spacing:-0.08em;

  pointer-events:none;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  background:#e9e9e9;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;
}

#intro-text{
  font-size:18px;
  font-weight:900;
  letter-spacing:-2px;
  display:flex;
}

.letter{
  display:inline-block;
}

/* TOP NAV */

.top-nav{
  margin-top:1.6vw;

  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;

  z-index:100;
}

.top-nav a{
  color:#111;
  text-decoration:none;

  font-family:
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;

  font-size:15px;
  font-weight:300;

  transition:opacity .25s ease;
}

.top-nav a:hover{
  opacity:.5;
}

.top-nav .dot{
  color:#111;
  font-size:5px;
}

/* TAGLINE */

.tagline{
  position:absolute;
  bottom:32px;
  left:36px;
  right:36px;

  font-size:clamp(10px, 1.17vw, 13.5px);
  font-weight:500;
  line-height:1.4;
  color:#111;
  text-align:right;

  z-index:100;
  pointer-events:none;
}

/* CANVAS */

canvas{
  position:absolute;
  inset:0;
  z-index:1;
}

/* MOBILE */

@media(max-width:768px){

  .hero{
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    max-width:90vw;
    text-align:center;
  }

  h1{
    font-size:20vw;
  }

  .top-nav{
    margin-top:10px;
    gap:8px;
    justify-content:center;
  }

  .top-nav a{
    font-size:13px;
    white-space:nowrap;
  }

  .tagline{
    font-size:9.6px;
    text-align:center;
  }

  .flip-toggle{
    top:24px;
    left:18px;
    transform:none;
    padding:5px 10px;
    font-size:8px;
  }

  .mind-text{
    max-width:80vw;
    padding:0 12px;
  }

  .mind-card{
    width:var(--wm, var(--w));
  }
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div id="intro-text"></div>
</div>

<!-- BACKSIDE TOGGLE -->
<button class="flip-toggle" id="flipToggle" aria-label="Toggle backside">
  <span id="flipToggleLabel">The Back of My Mind</span>
</button>

<div class="stage">
  <div class="flipper" id="flipper">

    <!-- FRONT -->
    <div class="face front" id="frontFace">

      <!-- HERO -->
      <div class="hero">

        <h1>MINSUNG</h1>

        <nav class="top-nav">
          <a href="pages/about/index.html">About</a>
          <span class="dot">•</span>
          <a href="pages/projects/index.html">Projects</a>
          <span class="dot">•</span>
          <a href="pages/contact/index.html">Contact</a>
        </nav>

      </div>
    </div>

    <!-- BACK -->
    <div class="face back" id="backFace">
      <div class="mind-scene" id="mindScene">

        <div class="mind-text">
          <p class="back-text">For the sweetness of the grain is revealed by loving restraint.</p>
        </div>

      </div>
    </div>

  </div>
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

/* SCENE */

const scene = new THREE.Scene();

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  40,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.z = 13;

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
});

renderer.setSize(innerWidth, innerHeight);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

document.getElementById(
  "frontFace"
).appendChild(
  renderer.domElement
);

/* GROUP */

const mainGroup = new THREE.Group();

scene.add(mainGroup);

/* SETTINGS */

const images = [
  "imgs/photo1.webp",
  "imgs/photo2.webp",
  "imgs/photo3.webp",
  "imgs/photo4.webp",
  "imgs/photo5.webp",
  "imgs/photo6.webp"
];

const urls = [
  "pages/projects/index.html"
];

const radius = 4.6;
const baseWidth = 4;
const baseHeight = baseWidth * 0.65;
const perRow = 4;

const rowSettings = [
  { y: 4.7, speed: 0.0016, phase: 0 },
  { y: 0, speed: -0.0022, phase: 1.4 },
  { y: -4.7, speed: 0.0019, phase: 2.7 }
];

const rowGroups = [];
const objects = [];

/* ROUNDED TEXTURE */

function createTexture(img){

  const canvas =
    document.createElement("canvas");

  const size = 512;

  canvas.width = size;
  canvas.height = size;

  const ctx =
    canvas.getContext("2d");

  const r = 18;

  ctx.clearRect(0,0,size,size);

  ctx.beginPath();
  ctx.moveTo(r,0);
  ctx.lineTo(size-r,0);
  ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);
  ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);
  ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);
  ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();

  ctx.clip();

  ctx.translate(size,0);
  ctx.scale(-1,1);

  ctx.drawImage(
    img,
    0,
    0,
    size,
    size
  );

  return new THREE.CanvasTexture(canvas);
}

/* CREATE ROWS */

rowSettings.forEach(row=>{

  const rowGroup = new THREE.Group();

  rowGroup.position.y = row.y;

  rowGroup.rotation.y = row.phase;

  mainGroup.add(rowGroup);

  rowGroups.push({
    group: rowGroup,
    speed: row.speed,
    isMiddle: row.y === 0
  });

  const ringImages =
    images.slice(0, perRow);

  ringImages.forEach((src,i)=>{

    const angle =
      (i / ringImages.length)
      * Math.PI * 2;

    const x =
      Math.cos(angle)
      * radius;

    const z =
      Math.sin(angle)
      * radius;

    const geometry =
      new THREE.PlaneGeometry(
        baseWidth,
        baseHeight
      );

    const material =
      new THREE.MeshBasicMaterial({
        color:0xffffff,
        side:THREE.DoubleSide,
        transparent:true,
        depthWrite:false
      });

    const plane =
      new THREE.Mesh(
        geometry,
        material
      );

    plane.position.set(x,0,z);

    plane.lookAt(0,0,0);

    rowGroup.add(plane);

    objects.push(plane);

    const img = new Image();
    img.src = src;

    img.onload = ()=>{

      material.map =
        createTexture(img);

      material.needsUpdate =
        true;
    };
  });
});

/* RAYCAST */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

let hovered = null;

/* HOVER */

renderer.domElement
.addEventListener(
"mousemove",
e=>{

  mouse.x =
    (e.clientX /
    innerWidth)
    * 2 - 1;

  mouse.y =
    -(e.clientY /
    innerHeight)
    * 2 + 1;

  raycaster
    .setFromCamera(
      mouse,
      camera
    );

  const hits =
    raycaster
    .intersectObjects(objects);

  if(hits.length){

    const obj =
      hits[0].object;

    if(hovered !== obj){

      if(hovered){
        hovered.material
        .color
        .set(0xffffff);
      }

      hovered = obj;

      obj.material.color
      .setRGB(
        1.25,
        1.25,
        1.25
      );
    }

  } else if(hovered){

    hovered.material
      .color
      .set(0xffffff);

    hovered = null;
  }
});

/* CLICK */

renderer.domElement
.addEventListener(
"click",
e=>{

  mouse.x =
    (e.clientX /
    innerWidth)
    * 2 - 1;

  mouse.y =
    -(e.clientY /
    innerHeight)
    * 2 + 1;

  raycaster
    .setFromCamera(
      mouse,
      camera
    );

  const hits =
    raycaster
    .intersectObjects(objects);

  if(hits.length){

    const index =
      objects.indexOf(
        hits[0].object
      );

    window.location.href =
      urls[
        index %
        urls.length
      ];
  }
});

/* LAYOUT */

function layout(){

  const isMobile =
    innerWidth < 768;

  mainGroup.position.x =
    isMobile ? 0 : 6.84;

  mainGroup.scale
    .setScalar(
      isMobile ? 0.5 : 1
    );

  rowGroups.forEach(row=>{

    row.group.visible =
      !(isMobile && row.isMiddle);
  });
}

layout();

/* ANIMATION */

function animate(){

  requestAnimationFrame(
    animate
  );

  rowGroups.forEach(row=>{

    row.group.rotation.y +=
      row.speed;
  });

  renderer.render(
    scene,
    camera
  );
}

animate();

/* RESIZE */

window
.addEventListener(
"resize",
()=>{

  camera.aspect =
    innerWidth /
    innerHeight;

  camera
    .updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  layout();
});

/* INTRO */

const intro =
document.getElementById(
  "intro"
);

const introText =
document.getElementById(
  "intro-text"
);

const finalText =
"MINSUNG";

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ";

let letters = [];

let frame = 0;
let revealSpeed = 5;

finalText
.split("")
.forEach(()=>{

  const span =
    document
    .createElement(
      "span"
    );

  span.className =
    "letter";

  introText
    .appendChild(
      span
    );

  letters.push(span);
});

function animateIntro(){

  letters.forEach(
  (el,i)=>{

    if(
      i <
      frame /
      revealSpeed
    ){

      el.innerText =
        finalText[i];

      el.style.transform =
        "translateY(0px) scaleY(1)";

    } else {

      el.innerText =
        chars[
          Math.floor(
            Math.random()
            * chars.length
          )
        ];

      const x =
        (Math.random()
        -0.5) * 10;

      const y =
        (Math.random()
        -0.5) * 20;

      el.style.transform =
        `translate(${x}px,${y}px)
        scaleY(${1 +
        Math.random()*0.4})`;
    }

  });

  frame++;

  if(
    frame <
    finalText.length
    * revealSpeed + 15
  ){

    requestAnimationFrame(
      animateIntro
    );

  } else {

    setTimeout(()=>{

      intro.style.transition =
        "opacity .8s ease";

      intro.style.opacity =
        "0";

      setTimeout(()=>{
        intro.remove();
      },800);

    },400);
  }
}

animateIntro();

/* BACKSIDE FLIP */

const flipper =
document.getElementById(
  "flipper"
);

const flipToggle =
document.getElementById(
  "flipToggle"
);

const flipToggleLabel =
document.getElementById(
  "flipToggleLabel"
);

const frontFace =
document.getElementById(
  "frontFace"
);

let isBack = false;

flipToggle
.addEventListener(
"click",
()=>{

  isBack = !isBack;

  flipper.classList
    .toggle(
      "flipped",
      isBack
    );

  flipToggle.classList
    .toggle(
      "is-back",
      isBack
    );

  const nextLabel =
    isBack ?
      "Front" :
      "The Back of My Mind";

  window.setTimeout(
  ()=>{
    flipToggleLabel
      .textContent =
      nextLabel;

    frontFace.classList
      .toggle(
        "content-hidden",
        isBack
      );
  },
  550
  );
});

/* BACK SCENE — 3D SCATTER PARALLAX */

const mindScene =
document.getElementById(
  "mindScene"
);

const mindProjects = [
  {
    img:"imgs/back-web/kinetic-time-orbiter.jpg",
    alt:"Kinetic Time Orbiter",
    title:"Kinetic Time Orbiter",
    year:"2026",
    desc:"Visualizing time is different from simply seeing it. To perceive time in a single moment is to possess a kind of control over it. Rather than separating the hour and minute hands, this object proposes a clock in which the hour hand, the minute hand, and the clock itself exist as one."
  },
  {
    img:"imgs/back-web/12-rules-for-life.jpg",
    alt:"12 Rules for Life, alternate poster",
    title:"12 Rules for Life",
    year:"2024",
    desc:"This project reimagines 12 Rules for Life by Jordan Peterson across two forms: a poster series that translates its conceptual themes into visual form and event identity, and an editorial exploration through typography and publication design. Rather than illustrating the book directly, it translates its ideas into a visual reading experience, examining how structure, hierarchy, and pacing can communicate discipline, order, and reflection."
  },
  {
    img:"pages/imgs/background05.webp",
    alt:"Coal + Ice interactive climate web experience",
    title:"Coal + Ice",
    year:"2024",
    desc:"Coal+Ice is an interactive web project inspired by an Asia Society event, translating climate change into a responsive digital experience. Powered by a realtime weather API, the interface gradually melts as temperatures rise, creating a visual reflection on fragility and environmental change."
  },
  {
    img:"pages/imgs/background06.webp",
    alt:"Solar System infographic poster design",
    title:"Solar System",
    year:"2023",
    desc:"Solar System is an infographic poster design that visualizes information about the solar system and its planets. Using a network of lines to represent planetary distance and movement, the project transforms scientific information into a clear and engaging visual system."
  },
  {
    img:"pages/imgs/photo3.webp",
    alt:"Receipt? Rethink! environmental campaign posters",
    title:"Receipt? Rethink!",
    year:"2023",
    desc:"Receipt? Rethink! is a campaign project encouraging audiences to reconsider the everyday use of receipt paper. Through infographic-driven poster designs, the project visualizes the environmental and material costs of production, including BPA, tree usage, and water consumption."
  }
];

const mindCardCount = mindProjects.length;

function buildMindCards(){

  for(let i=0; i<mindCardCount; i++){

    const p =
      mindProjects[
        i % mindProjects.length
      ];

    let t, l, tries = 0;

    do {

      t = 5 + Math.random() * 90;
      l = 5 + Math.random() * 90;
      tries++;

    } while(
      tries < 12 &&
      Math.pow((l-50)/27,2) +
      Math.pow((t-50)/19,2) < 1
    );

    const z =
      Math.round(
        -60 + Math.random() * 150
      );

    const depth =
      (0.25 + Math.random() * 0.6)
        .toFixed(2);

    const w =
      Math.round(
        46 + Math.random() * 40
      );

    const wm =
      Math.round(
        30 + Math.random() * 26
      );

    const card =
      document.createElement("div");

    card.className = "mind-card";
    card.dataset.depth = depth;

    card.style.setProperty("--t", t.toFixed(2) + "%");
    card.style.setProperty("--l", l.toFixed(2) + "%");
    card.style.setProperty("--z", z + "px");
    card.style.setProperty("--w", w + "px");
    card.style.setProperty("--wm", wm + "px");

    card.innerHTML =
      '<div class="mind-card-image">' +
        '<img src="' + p.img + '" alt="' + p.alt + '" loading="lazy">' +
      '</div>' +
      '<div class="mind-card-info">' +
        '<h3 class="mind-card-title">' + p.title + '</h3>' +
        '<p class="mind-card-year">' + p.year + '</p>' +
        '<p class="mind-card-desc">' + p.desc + '</p>' +
      '</div>';

    mindScene.appendChild(card);
  }
}

buildMindCards();

const mindCards =
Array.from(
  mindScene.querySelectorAll(
    ".mind-card"
  )
);

const maxShiftX = 26;
const maxShiftY = 16;

let rafPending = false;
let lastEvent = null;

function applyParallax(){

  rafPending = false;

  if(!isBack || !lastEvent) return;

  const nx =
    (lastEvent.clientX / innerWidth - 0.5) * 2;

  const ny =
    (lastEvent.clientY / innerHeight - 0.5) * 2;

  mindCards.forEach((card)=>{

    const depth =
      parseFloat(
        card.dataset.depth
      ) || 0.5;

    card.style.setProperty(
      "--px",
      (nx * maxShiftX * depth) + "px"
    );

    card.style.setProperty(
      "--py",
      (ny * maxShiftY * depth) + "px"
    );
  });
}

window.addEventListener(
"mousemove",
(e)=>{

  lastEvent = e;

  if(!rafPending){
    rafPending = true;
    requestAnimationFrame(applyParallax);
  }
});

mindCards.forEach((card)=>{

  card.addEventListener(
  "click",
  ()=>{

    const wasActive =
      card.classList.contains(
        "is-active"
      );

    mindCards.forEach((c)=>
      c.classList.remove(
        "is-active"
      )
    );

    if(!wasActive){
      card.classList.add(
        "is-active"
      );
    }
  });
});

mindScene.addEventListener(
"click",
(e)=>{

  if(
    e.target.closest(
      ".mind-card"
    )
  ) return;

  mindCards.forEach((c)=>
    c.classList.remove(
      "is-active"
    )
  );
});

</script>

</body>
</html>
