<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:#e9e9e9;
  color:#111;

  font-family:Arial, Helvetica, sans-serif;

  overflow:hidden;
}

/* -------------------
HERO
------------------- */

.hero-about{
  position:fixed;
  left:18px;
  right:40px;
  top:50%;

  transform:translateY(-55%);

  display:flex;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:64px;

  z-index:10;
}

h1{
  margin:0;

  font-size:11vw;
  line-height:.88;
  font-weight:900;
  letter-spacing:-0.08em;

  flex-shrink:0;

  pointer-events:none;
}

/* -------------------
ABOUT TEXT
------------------- */

.about-right{
  display:flex;
  flex-direction:column;
  gap:22px;

  max-width:520px;

  padding-top:12px;
}

.about-panel{
  background:transparent;

  padding:0;
}

.about-text{
  margin:0;

  font-size:clamp(14px, 1.36vw, 18px);
  line-height:1.55;

  color:#666;
}

.about-text span{
  display:inline-block;

  transition:
    transform .15s ease,
    color .2s ease;
}

.resume-link{
  align-self:flex-start;

  display:inline-block;

  text-decoration:none;
  color:#111;

  border:1px solid #111;
  border-radius:999px;

  padding:8px 20px;

  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;

  transition:
    background .25s ease,
    color .25s ease;
}

.resume-link:hover{
  background:#111;
  color:#fff;
}

/* -------------------
HAMBURGER
------------------- */

.menu-trigger{
  position:fixed;
  top:28px;
  right:32px;

  width:34px;
  height:22px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  cursor:pointer;

  z-index:9999;
}

.menu-trigger span{
  display:block;
  height:3px;

  background:#111;
  border-radius:2px;

  transition:opacity .2s ease;
}

.menu-trigger:hover span{
  opacity:.6;
}

.menu{
  position:fixed;
  top:60px;
  right:32px;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  pointer-events:none;

  transition:.25s ease;

  z-index:9998;

  background:rgba(255,255,255,.72);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,.55);

  padding:20px;

  border-radius:14px;

  min-width:140px;
}

.menu.show{
  opacity:1;
  pointer-events:auto;
}

.menu a{
  text-decoration:none;
  color:#111;

  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;

  transition:.2s ease;
}

.menu a:hover{
  opacity:.45;
}

/* -------- MOBILE -------- */
@media (max-width: 768px) {

  .hero-about{
    position:static;
    transform:none;

    flex-direction:column;

    padding:100px 24px 60px;
    gap:32px;
  }

  h1{
    font-size:20vw;
  }

  .about-right{
    max-width:100%;
    padding-top:0;
  }

  .menu-trigger{
    top:24px;
    right:24px;
  }

  .menu{
    top:52px;
    right:24px;
  }

  body{
    overflow:auto;
  }
}
</style>
</head>

<body>

<!-- Hamburger -->
<div class="menu-trigger" id="hamburger">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- Menu -->
<div class="menu" id="menu">
  <a href="../../index.html">Home</a>
  <a href="../../pages/projects/index.html">Projects</a>
  <a href="../../pages/contact/index.html">Contact</a>
</div>

<!-- Content -->
<div class="hero-about">

  <h1>MINSUNG</h1>

  <div class="about-right">

    <div class="about-panel">
      <p class="about-text" id="aboutText">Designer based in NYC / Seoul. Focused on graphic design, type design, interactive media, and visual systems. Currently studying Communication Design at Parsons School of Design. Previously served in the ROK Army as a driver and interpreter.</p>
    </div>

    <a
      class="resume-link"
      href="resume.pdf"
      target="_blank">
      Resume ↗
    </a>

  </div>

</div>

<script>
/* Hamburger */
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};

/* -------- Proximity Text -------- */
const text = document.getElementById("aboutText");
const words = text.innerText.split(" ");

text.innerHTML = words.map(word => {
  return word.split("").map(letter => `<span>${letter}</span>`).join("") + " ";
}).join("");

const spans = text.querySelectorAll("span");

const isMobile = window.innerWidth < 600;

function handleMove(x, y) {
  spans.forEach(span => {

    const rect = span.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const dx = x - cx;
    const dy = y - cy;

    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = isMobile ? 80 : 120;

    if (dist < maxDist) {
      const force = (maxDist - dist) / maxDist;

      span.style.transform =
        `translate(${dx * 0.03 * force}px, ${dy * 0.03 * force}px)`;
        span.style.color = "#111";
        } else {
      span.style.transform = "translate(0,0)";
      span.style.color = "#aaa";
    }

  });
}

document.addEventListener("mousemove", (e) => {
  handleMove(e.clientX, e.clientY);
});

document.addEventListener("touchmove", (e) => {
  const touch = e.touches[0];
  handleMove(touch.clientX, touch.clientY);
});
</script>

</body>
</html>
