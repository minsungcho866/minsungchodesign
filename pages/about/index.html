<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
body {
  margin: 0;
  background: #181818;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

/* Layout */
.container {
  max-width: 900px;
  margin: 120px auto;
  padding: 0 20px;
}

/* Title */
h1 {
  font-size: 20px;
  font-weight: 300;
  margin-bottom: 60px;
  text-align: center;
}

/* About Text */
.about-text {
  font-size: 28px;
  line-height: 1.6;
  color: #aaa;
  max-width: 720px;

  white-space: pre-line;
  text-align: center;
  margin: 0 auto;
}

/* Add real spacing between lines */
.about-text br {
  display: block;
  margin-bottom: 12px;
}

/* Character animation */
.about-text span {
  display: inline-block;
  transition: transform 0.15s ease, color 0.2s ease;
}

/* Hamburger */
.hamburger {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 35px;
  height: 30px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hamburger div {
  height: 3px;
  background: #fff;
  transition: 0.3s;
}
.hamburger.active div:nth-child(1){
  transform: rotate(45deg) translate(6px,6px);
}
.hamburger.active div:nth-child(2){opacity:0;}
.hamburger.active div:nth-child(3){
  transform: rotate(-45deg) translate(7px,-7px);
}

/* Menu */
.menu {
  position: absolute;
  top: 70px;
  right: 20px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}
.menu.show {
  opacity: 1;
  pointer-events: auto;
}
.menu a {
  color: #fff;
  text-decoration: none;
  margin-bottom: 10px;
}
.menu a:hover {
  text-decoration: underline;
}

/* -------- MOBILE -------- */
@media (max-width: 600px) {

  .container {
    margin: 80px auto;
  }

  h1 {
    font-size: 16px;
    margin-bottom: 40px;
  }

  .about-text {
    font-size: 18px;
    line-height: 1.6;
    max-width: 320px;

    text-align: left; /* 🔥 key fix */
  }

  .hamburger {
    width: 28px;
    height: 22px;
  }

  .menu {
    top: 60px;
    right: 15px;
  }
}
</style>
</head>

<body>

<!-- Hamburger -->
<div class="hamburger" id="hamburger">
  <div></div><div></div><div></div>
</div>

<!-- Menu -->
<div class="menu" id="menu">
  <a href="../../index.html">Home</a>
  <a href="../../pages/projects/index.html">Projects</a>
  <a href="../../pages/contact/index.html">Contact</a>
</div>

<!-- Content -->
<div class="container">
  <h1>About</h1>

  <div class="about-text" id="aboutText">
Designer

Based in
NYC / Seoul


Education
Parsons School of Design — BFA Communication Design


Designer @ Angel Music


Served in
ROK Army — driver / interpreter (U.S. joint operations)
  </div>
</div>

<script>
/* Hamburger */
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};

/* -------- Proximity Text -------- */
const text = document.getElementById("aboutText");
const letters = text.innerText.split("");

text.innerHTML = letters.map(letter => {
  if (letter === "\n") return "<br>";
  if (letter === " ") return " ";
  return `<span>${letter}</span>`;
}).join("");

const spans = text.querySelectorAll("span");

const isMobile = window.innerWidth < 600;

function handleMove(x, y) {
  spans.forEach(span => {

    const rect = span.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const dx = x - cx;
    const dy = y - cy;

    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = isMobile ? 80 : 120;

    if (dist < maxDist) {
      const force = (maxDist - dist) / maxDist;

      span.style.transform =
        `translate(${dx * 0.03 * force}px, ${dy * 0.03 * force}px)`;
      span.style.color = "#fff";
    } else {
      span.style.transform = "translate(0,0)";
      span.style.color = "#aaa";
    }

  });
}

document.addEventListener("mousemove", (e) => {
  handleMove(e.clientX, e.clientY);
});

document.addEventListener("touchmove", (e) => {
  const touch = e.touches[0];
  handleMove(touch.clientX, touch.clientY);
});
</script>

</body>
</html>
