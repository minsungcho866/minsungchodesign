<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
body {
  margin: 0;
  background: #181818;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

/* SAME container as projects */
.container {
  max-width: 900px;
  margin: 120px auto;
  padding: 0 20px;
}

/* SAME title style */
h1 {
  font-size: 20px;
  font-weight: 300;
  margin-bottom: 60px;
}

/* SAME text rhythm as project list */
.contact-list {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

/* Match project-item style */
.contact-item {
  font-size: 28px;
  color: #aaa;
  text-decoration: none;
  transition: 0.3s;
}

.contact-item:hover {
  color: #fff;
}

/* Links */
.contact-item a {
  color: inherit;
  text-decoration: none;
}

.contact-item a:hover {
  text-decoration: underline;
}

/* ----------------- Hamburger ----------------- */
.hamburger {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 35px;
  height: 30px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hamburger div {
  height: 3px;
  background: #fff;
  transition: 0.3s;
}
.hamburger.active div:nth-child(1){
  transform: rotate(45deg) translate(6px,6px);
}
.hamburger.active div:nth-child(2){opacity:0;}
.hamburger.active div:nth-child(3){
  transform: rotate(-45deg) translate(7px,-7px);
}

/* Menu */
.menu {
  position: absolute;
  top: 70px;
  right: 20px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}
.menu.show {
  opacity: 1;
  pointer-events: auto;
}
.menu a {
  color: #fff;
  text-decoration: none;
  margin-bottom: 10px;
}
.menu a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- Hamburger -->
<div class="hamburger" id="hamburger">
  <div></div><div></div><div></div>
</div>

<!-- Menu -->
<div class="menu" id="menu">
  <a href="../../index.html">Home</a>
  <a href="../../pages/about/index.html">About</a>
  <a href="../../pages/projects/index.html">Projects</a>
</div>

<!-- Content -->
<div class="container">
  <h1>Contact</h1>

  <div class="contact-list">
    <div class="contact-item">
      Email: <a href="mailto:ryancho8765@gmail.com">ryancho8765@gmail.com</a>
    </div>

    <div class="contact-item">
      Phone: <a href="tel:-">-</a>
    </div>

    <div class="contact-item">
      Instagram: <a href="https://instagram.com/minsung.wh" target="_blank">@minsung.wh</a>
    </div>
  </div>
</div>

<script>
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};
</script>

</body>
</html>
