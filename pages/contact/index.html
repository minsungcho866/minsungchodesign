<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
body{
  margin:0;

  background:#f8f8f6;
  color:#111;

  font-family:Arial, Helvetica, sans-serif;
}

/* -------------------
MENU
------------------- */

.menu-trigger{
  position:fixed;
  top:32px;
  right:40px;

  z-index:9999;

  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;

  cursor:pointer;

  color:#111;

  transition:.2s ease;
}

.menu-trigger:hover{
  opacity:.5;
}
.menu{
  position:fixed;
  top:60px;
  right:40px;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  pointer-events:none;

  transition:.25s ease;

  z-index:9998;

  background:rgba(255,255,255,.7);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,.5);

  padding:20px;

  border-radius:14px;

  min-width:140px;
}

.menu.show{
  opacity:1;
  pointer-events:auto;
}

.menu a{
  text-decoration:none;
  color:#111;

  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;

  transition:.2s ease;
}

.menu a:hover{
  opacity:.45;
}



/* -------------------
LAYOUT
------------------- */

.container{

  margin:0 auto;

  padding:
    120px
    40px
    80px;
}

/* -------------------
TITLE
------------------- */

.page-label{
  font-size:12px;

  letter-spacing:.14em;

  text-transform:uppercase;

  color:#777;

  margin-bottom:12px;
}

h1{
  font-size:clamp(48px,8vw,120px);

  line-height:.92;

  font-weight:300;

  margin:0 0 60px;
}

/* -------------------
CONTACT LIST
------------------- */

.contact-list{
  display:flex;
  flex-direction:column;

  gap:32px;
}

.contact-item{
  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  padding-bottom:18px;

  border-bottom:
    1px solid
    rgba(0,0,0,.08);
}

.contact-label{
  font-size:14px;

  color:#777;

  text-transform:uppercase;

  letter-spacing:.08em;
}

.contact-value a{
  text-decoration:none;

  color:#111;

  font-size:28px;

  transition:.25s ease;
}

.contact-value a:hover{
  opacity:.5;
}
</style>
</head>

<body>

<!-- Hamburger -->
<div class="menu-trigger" id="hamburger">
  MENU
</div>

<!-- Menu -->
<div class="menu" id="menu">
  <a href="../../index.html">Home</a>
  <a href="../../pages/about/index.html">About</a>
  <a href="../../pages/projects/index.html">Projects</a>
</div>
<div class="container">

  <div class="page-label">
   
  </div>

  <h1>
    Contact.
  </h1>

  <div class="contact-list">

    <div class="contact-item">

      <div class="contact-label">
        Email
      </div>

      <div class="contact-value">
        <a href="mailto:ryancho8765@gmail.com">
          ryancho8765@gmail.com
        </a>
      </div>

    </div>

    <div class="contact-item">

      <div class="contact-label">
        Instagram
      </div>

      <div class="contact-value">
        <a href="https://instagram.com/minsung.wh" target="_blank">
          @minsung.wh
        </a>
      </div>

    </div>

    <div class="contact-item">

      <div class="contact-label">
        Are.na
      </div>

      <div class="contact-value">
        <a href="https://www.are.na/minsung-cho/channels" target="_blank">
          View Channel
        </a>
      </div>

    </div>

  </div>

</div>

<script>
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};
</script>

</body>
</html>
