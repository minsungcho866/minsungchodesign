<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Projects — Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f8f8f6;
  overflow-x:hidden;
  font-family:Arial, Helvetica, sans-serif;
}

.menu{
  position:fixed;
  top:60px;
  right:40px;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  pointer-events:none;

  transition:.25s ease;

  z-index:9998;

  background:rgba(255,255,255,.7);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,.5);

  padding:20px;

  border-radius:14px;

  min-width:140px;
}

.menu a{
  text-decoration:none;

  color:#111;

  font-size:13px;

  letter-spacing:.08em;

  text-transform:uppercase;

  transition:.2s ease;
}

.menu a:hover{
  opacity:.45;
}
/* -----------------------
   HERO
----------------------- */

.hero{
  padding:80px 40px 24px;
}

.hero-name{
  font-size:14px;
  letter-spacing:.08em;
  margin-bottom:12px;
  color:#666;
}

.hero-title{
  font-size:clamp(48px,8vw,120px);
  font-weight:300;
  line-height:.95;

  margin-bottom:48px;
}

/* -----------------------
   FILTER
----------------------- */

.filter-bar{
  position:sticky;
  top:0;

  z-index:100;

  background:#f8f8f6;

  padding:14px 0;

  display:flex;
  gap:24px;
  flex-wrap:wrap;
}

.filter-btn{
  background:none;
  border:none;

  cursor:pointer;

  font-size:15px;
  color:#999;

  transition:.2s ease;
}

.filter-btn:hover{
  color:black;
}

.filter-btn.active{
  color:black;
}

.menu-trigger{
  position:fixed;
  top:32px;
  right:40px;

  z-index:9999;

  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;

  cursor:pointer;

  color:#111;

  transition:.2s ease;
}

.menu-trigger:hover{
  opacity:.5;
}

/* -----------------------
   HOME LOGO
----------------------- */

.home-logo{
  position:fixed;
  top:28px;
  left:40px;

  z-index:9999;

  font-weight:900;
  font-size:20px;
  letter-spacing:-0.04em;

  color:#111;
  text-decoration:none;
  line-height:1;

  transition:opacity .2s ease;
}

.home-logo:hover{
  opacity:.5;
}

.menu.show{
  opacity:1;
  pointer-events:auto;
}

/* -----------------------
   PROJECT FEED
----------------------- */

.projects-feed{
  width:100%;

  padding: 0 40px 40px;
}

.project-card{
  width:100%;
  height:88vh;

  position:relative;
  overflow:hidden;
  cursor:pointer;

  margin-bottom:28px;

  background:white;

  border-radius:12px;

  box-shadow:
  0 2px 6px rgba(0,0,0,.04),
  0 8px 16px rgba(0,0,0,.04);
}


.project-card:last-child{
  margin-bottom:0;
}

.project-card img,
.placeholder{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  transition:
    transform .9s ease,
    filter .9s ease;
}

.project-card:hover img,
.project-card:hover .placeholder{
  transform:scale(1.02);
}

/* -----------------------
   POPUP
----------------------- */

.popup-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.4);

  display:flex;
  justify-content:center;
  align-items:center;

  opacity:0;
  pointer-events:none;

  transition:.3s ease;

  z-index:10000;
}

.popup-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.popup{
  position:relative;
  width:min(720px,90vw);
  max-height:90vh;
  overflow-y:auto;

  background:#fff;

  border-radius:16px;

  box-shadow:0 16px 48px rgba(0,0,0,.12);
}

.popup-overlay.active .popup{
  transform:translateY(0);
}

.close-popup{
  position:absolute;
  top:16px;
  right:20px;

  border:none;
  background:rgba(255,255,255,.8);
  width:36px;
  height:36px;
  border-radius:50%;

  font-size:22px;
  line-height:36px;
  text-align:center;
  cursor:pointer;
  color:#111;

  z-index:2;
  transition:.2s ease;
}

.close-popup:hover{
  background:rgba(255,255,255,1);
}

.popup-carousel{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:16px 16px 0 0;
  background:#eee;
}

.popup-carousel img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.popup-body{
  padding:32px 36px 36px;
}

.popup-title{
  font-size:clamp(32px,5vw,56px);
  line-height:1;
  margin-bottom:8px;
  font-weight:700;
}

.popup-category{
  font-size:13px;
  color:#666;
  margin-bottom:20px;
}

.popup-description{
  font-size:15px;
  line-height:1.8;
  max-width:620px;
  margin-bottom:32px;
  color:#333;
}

.popup-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:16px;
}

.popup-link{
  display:inline-flex;
  align-items:center;
  gap:8px;

  color:#111;
  text-decoration:none;

  font-size:16px;
  font-weight:600;
  letter-spacing:.02em;

  transition:.25s ease;
}

.popup-link:hover{
  opacity:.6;
}

.popup-contact-link{
  display:inline-flex;
  align-items:center;
  gap:6px;

  color:#666;
  text-decoration:none;

  font-size:14px;
  font-weight:500;

  transition:.25s ease;
}

.popup-contact-link:hover{
  color:#111;
}

/* -----------------------
   MOBILE
----------------------- */

@media(max-width:768px){

  .projects-feed{
    padding:12px;
  }

  .project-card{
    height:auto;
    aspect-ratio:4/3;
    margin-bottom:12px;
    border-radius:8px;
  }

  .popup{
    width:95vw;
    max-height:90vh;
  }

  .popup-body{
    padding:24px 20px 28px;
  }

  .popup-title{
    font-size:28px;
  }

  .popup-description{
    font-size:14px;
  }

  .popup-actions{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }

  .hero{
    padding:60px 12px 16px;
  }

  .filter-bar{
    gap:14px;
  }

  .filter-btn{
    font-size:13px;
  }

  .menu-trigger{
    top:24px;
    right:24px;
  }

  .menu{
    top:52px;
    right:24px;
  }

  .home-logo{
    top:24px;
    left:24px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<!-- HOME LOGO -->
<a class="home-logo" href="../../index.html">MINSUNG</a>

<!-- HAMBURGER -->
<div class="menu-trigger" id="hamburger">
  MENU
</div>

<!-- MENU -->
<div class="menu" id="menu">
  <a href="../../index.html">Home</a>
  <a href="../../pages/about/index.html">About</a>
  <a href="../../pages/contact/index.html">Contact</a>
</div>

<section class="hero">


  <div class="filter-bar">

    <button class="filter-btn active"
      data-filter="all">
      All
    </button>

    <button class="filter-btn"
      data-filter="Website">
      Website
    </button>

    <button class="filter-btn"
      data-filter="Book">
      Book
    </button>

    <button class="filter-btn"
      data-filter="Poster">
      Poster
    </button>

    <button class="filter-btn"
      data-filter="Typeface">
      Typeface
    </button>

    <button class="filter-btn"
      data-filter="System">
      System
    </button>

    <button class="filter-btn"
      data-filter="Archive">
      Archive
    </button>

    <button class="filter-btn"
      data-filter="Exhibition">
      Exhibition
    </button>

    <button class="filter-btn"
      data-filter="Objects">
      Objects
    </button>

  </div>

</section>

<!-- PROJECTS -->
<div class="projects-feed">

  <!-- Wallet Saver -->
  <div class="project-card"
    data-category="Website"
    data-title="Wallet Saver Map"
    data-description="WALLET SAVER MAP is a web-based information design project that helps college students navigate Manhattan on a limited budget. Restaurants are categorized by affordability—high, medium, and low cost—creating an intuitive system for discovering budget-friendly dining options."
    data-link="https://chom866.interactive.rodeo/studio/projects/P2/mainpage/index.html"
    data-image="../imgs/background01.webp">

    <img src="../imgs/background01.webp" alt="Wallet Saver Map budget dining guide for Manhattan">
  </div>

  <!-- Home -->
  <div class="project-card"
    data-category="Book"
    data-title="Home"
    data-description="Home is an editorial book exploring the idea of home through the experience of growing up across multiple places without a fixed hometown. Combining three articles into a unified editorial design, the project reflects on themes of identity, displacement, and belonging."
    data-link="project2/index.html"
    data-image="../imgs/background02.webp">

    <img src="../imgs/background02.webp" alt="Home editorial book about identity and belonging">
  </div>

  <!-- History of Video Games -->
  <div class="project-card"
    data-category="Book"
    data-title="History of Video Games"
    data-description="History of Video Games is an editorial book project based on the Wikipedia article History of Video Games. Using the text as a foundation, each section is designed to reflect the visual identity and aesthetics of video games from its respective era."
    data-link=""
    data-image="../imgs/background04.webp">

    <img src="../imgs/background04.webp" alt="History of Video Games editorial book design">
  </div>

  <!-- Curvo -->
  <div class="project-card"
    data-category="Typeface"
    data-title="Curvo 2"
    data-description="Curvo 2 is a typeface built on the geometry of a squircle, between a square and a circle, balancing structure and softness through smooth, continuous curves. The system extends further: Movable Type becomes resin 3D-printed type, while Playing Cards reimagines card layouts in Curvo 2's visual language."
    data-link="project12/index.html"
    data-image="../imgs/photo9.webp">

    <img src="../imgs/photo9.webp" alt="Curvo 2 typeface specimen">
  </div>

  <!-- StoryType -->
  <div class="project-card"
    data-category="System"
    data-title="StoryType"
    data-description="StoryType is a plugin concept designed to make typography a more intuitive part of writing. Through AI-powered typeface recommendations and real-time font previews, the project allows users to explore how typography can shape mood, meaning, and emotional expression while writing."
    data-link=""
    data-image="../imgs/photo10.webp">

    <img src="../imgs/photo10.webp" alt="StoryType AI typography plugin concept">
  </div>

  <!-- Lifespan Market -->
  <div class="project-card"
    data-category="System"
    data-title="Lifespan Market"
    data-description="Every object reaches the end of its lifespan. However, determining that lifespan has never been within human control. Some objects may last one year, while others endure for five. But if that lifespan could be controlled, it would inevitably acquire a price. As long as human desire exists, such a market is unavoidable. Lifespan Market imagines a world where objects are sold with predetermined lifespans."
    data-link=""
    data-image="../../imgs/back-web/lifespan-market.jpg">

    <img src="../../imgs/back-web/lifespan-market.jpg" alt="Lifespan Market">
  </div>

  <!-- Exhibition -->
  <div class="project-card"
    data-category="Exhibition"
    data-title="zZ’ihň dd’-ah sé’Ki"
    data-description="zZ’ihn dd’-ah se’Ki is a collaborative video art project created for the CalArts Expo exhibition with the artist Soohyun Park and Horim Kim. Through moving image and experimental narrative, the work explores anxiety and the thoughts shaped by emotional instability and psychological tension."
    data-link=""
    data-image="../imgs/photo5.webp">

    <img src="../imgs/photo5.webp" alt="zZ’ihň dd’-ah sé’Ki collaborative video art installation">
  </div>

  <!-- Typeface Archive -->
  <div class="project-card"
    data-category="Archive"
    data-title="Typeface Archive"
    data-description="Typeface Archive is an ongoing archival project dedicated to documenting one typeface each day. Combining specimen design, historical research, and visual experimentation, each post translates the character of a typeface into a composition informed by its unique formal and stylistic qualities."
    data-link="https://typefacearchive.online/"
    data-image="../imgs/photo8.webp">

    <img src="../imgs/photo8.webp" alt="Typeface Archive daily typeface documentation">
  </div>

  <!-- Are.na -->
  <div class="project-card"
    data-category="Archive"
    data-title="Are.na"
    data-description="A curated collection of visual references, research, and inspiration organized across multiple channels on Are.na."
    data-link="https://www.are.na/minsung-cho/channels"
    data-image="../imgs/photo4.webp">

    <img src="../imgs/photo4.webp" alt="Are.na visual reference collection">
  </div>

</div>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay">

  <div class="popup">

    <button class="close-popup" id="closePopup">
      ×
    </button>

    <div class="popup-carousel" id="popupCarousel">
      <img id="popupImage" src="" alt="">
    </div>

    <div class="popup-body">

      <h1 class="popup-title" id="popupTitle"></h1>

      <div class="popup-category" id="popupCategory"></div>

      <p class="popup-description" id="popupDescription"></p>

      <div class="popup-actions">

        <a
          class="popup-contact-link"
          href="../contact/index.html">
          Contact for Detailed Portfolio →
        </a>

        <a
          class="popup-link"
          id="popupLink"
          href="#"
          target="_blank">
          Visit Website →
        </a>

      </div>

    </div>

  </div>

</div>

<script>

/* -----------------------
   HAMBURGER
----------------------- */

const hamburger =
document.getElementById("hamburger");

const menu =
document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};

/* -----------------------
   POPUP
----------------------- */

const popupOverlay =
document.getElementById("popupOverlay");

const popupCategory =
document.getElementById("popupCategory");

const popupTitle =
document.getElementById("popupTitle");

const popupDescription =
document.getElementById("popupDescription");

const popupLink =
document.getElementById("popupLink");

const popupImage =
document.getElementById("popupImage");

const closePopup =
document.getElementById("closePopup");

/* Open popup */

document.querySelectorAll(".project-card")
.forEach(card => {

  card.addEventListener("click", () => {

    popupCategory.textContent =
      card.dataset.category;

    popupTitle.textContent =
      card.dataset.title;

    popupDescription.textContent =
      card.dataset.description;

    popupImage.src =
      card.dataset.image;

    popupImage.alt =
      card.dataset.title;

    if(card.dataset.link){
      popupLink.href = card.dataset.link;
      popupLink.style.display = "inline-flex";
    } else {
      popupLink.style.display = "none";
    }

    popupOverlay.classList.add("active");
  });

});

/* Close */

function closeModal(){
  popupOverlay.classList.remove("active");
}

closePopup.addEventListener(
  "click",
  closeModal
);

popupOverlay.addEventListener(
  "click",
  (e)=>{
    if(e.target === popupOverlay){
      closeModal();
    }
  }
);

document.addEventListener(
  "keydown",
  (e)=>{
    if(e.key === "Escape"){
      closeModal();
    }
  }
);

/* -----------------------
   FILTER
----------------------- */

const filterButtons =
document.querySelectorAll(".filter-btn");

const cards =
document.querySelectorAll(".project-card");

filterButtons.forEach(button=>{

  button.addEventListener("click",()=>{

    filterButtons.forEach(btn=>{
      btn.classList.remove("active");
    });

    button.classList.add("active");

    const filter =
    button.dataset.filter;

    cards.forEach(card=>{

      const category =
      card.dataset.category;

      if(
        filter === "all" ||
        category === filter
      ){
        card.style.display = "block";
      }else{
        card.style.display = "none";
      }

    });

  });

});

</script>

</body>
</html>
