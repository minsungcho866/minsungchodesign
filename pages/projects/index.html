<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
body {
  margin: 0;
  background: #181818;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

/* Container */
.container {
  max-width: 900px;
  margin: 120px auto;
  padding: 0 20px;
}

/* Main Title */
h1 {
  font-size: 20px;
  font-weight: 300;
  margin-bottom: 40px;
}

/* Category Titles */
h2 {
  font-size: 14px;
  font-weight: 400;
  color: #777;
  margin-top: 50px;
  margin-bottom: 15px;
  letter-spacing: 0.05em;
}

/* List */
.project-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  z-index: 1;
}

/* Items */
.project-item {
  font-size: 26px;
  color: #aaa;
  text-decoration: none;
  transition: 0.3s;
}

.project-item:hover {
  color: #fff;
}

/* Hover image */
.hover-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 100;
  filter: grayscale(100%);
}

.hover-image img {
  width: 100%;
  display: block;
}

/* Hamburger */
.hamburger {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 35px;
  height: 30px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hamburger div {
  height: 3px;
  background: #fff;
  transition: 0.3s;
}
.hamburger.active div:nth-child(1){
  transform: rotate(45deg) translate(6px,6px);
}
.hamburger.active div:nth-child(2){opacity:0;}
.hamburger.active div:nth-child(3){
  transform: rotate(-45deg) translate(7px,-7px);
}

/* Menu */
.menu {
  position: absolute;
  top: 70px;
  right: 20px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}
.menu.show {
  opacity: 1;
  pointer-events: auto;
}
.menu a {
  color: #fff;
  text-decoration: none;
  margin-bottom: 10px;
}
.menu a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- Hamburger -->
<div class="hamburger" id="hamburger">
  <div></div><div></div><div></div>
</div>

<!-- Menu -->

  <a href="../../index.html">Home</a>

<!-- Hover Image -->
<div class="hover-image" id="hoverImage">
  <img src="" alt="">
</div>

<script>
/* Hamburger */
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};

/* Hover Image */
const hoverImage = document.getElementById("hoverImage");
const imgTag = hoverImage.querySelector("img");

document.querySelectorAll(".project-item").forEach(item => {

  item.addEventListener("mouseenter", () => {
    const imgSrc = item.dataset.img;
    if (!imgSrc) return;

    imgTag.src = imgSrc;
    hoverImage.style.opacity = 1;
    hoverImage.style.transform = "scale(1)";
  });

  item.addEventListener("mouseleave", () => {
    hoverImage.style.opacity = 0;
    hoverImage.style.transform = "scale(0.95)";
  });

  item.addEventListener("mousemove", (e) => {
    const offset = 20;

    const imgWidth = hoverImage.offsetWidth;
    const imgHeight = hoverImage.offsetHeight;

    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    let x = e.clientX + offset;
    let y = e.clientY + offset;

    if (x + imgWidth > viewportWidth) {
      x = e.clientX - imgWidth - offset;
    }

    if (y + imgHeight > viewportHeight) {
      y = e.clientY - imgHeight - offset;
    }

    hoverImage.style.left = x + "px";
    hoverImage.style.top = y + "px";
  });

});

/* Safety */
document.addEventListener("mousemove", (e) => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el || !el.classList.contains("project-item")) {
    hoverImage.style.opacity = 0;
  }
});
</script>

</body>
