<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#181818;
  overflow-x:hidden;
  font-family:Arial, Helvetica, sans-serif;
}

/* -----------------------
   HAMBURGER MENU
----------------------- */

.hamburger{
  position:fixed;
  top:24px;
  right:24px;
  width:52px;
  height:52px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  z-index:9999;

  background:black;
  border-radius:999px;
  padding:12px;
}

.hamburger div{
  height:2px;
  background:white;
  transition:.3s ease;
}

.hamburger.active div:nth-child(1){
  transform:rotate(45deg) translate(8px,8px);
}

.hamburger.active div:nth-child(2){
  opacity:0;
}

.hamburger.active div:nth-child(3){
  transform:rotate(-45deg) translate(8px,-8px);
}

.menu{
  position:fixed;
  top:85px;
  right:24px;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  pointer-events:none;
  transition:.3s ease;

  z-index:9998;

  background:black;
  padding:18px 20px;
  border-radius:16px;

  min-width:140px;
}

.menu.show{
  opacity:1;
  pointer-events:auto;
}

.menu a{
  color:white;
  text-decoration:none;
  font-size:14px;
  transition:opacity .2s ease;
}

.menu a:hover{
  opacity:0.6;
}

/* -----------------------
   PROJECT FEED
----------------------- */

.projects-feed{
  width:100%;
}

.project-card{
  width:100%;
  height:100vh;
  cursor:pointer;
  overflow:hidden;
  position:relative;
}

.project-card img,
.placeholder{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.8s ease;
}

.project-card:hover img,
.project-card:hover .placeholder{
  transform:scale(1.03);
}

.placeholder{
  background:#242424;
}

/* -----------------------
   POPUP
----------------------- */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(6px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s ease;
  z-index:10000;
}

.popup-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.popup{
  width:65vw;
  height:65vh;
  background:white;
  color:black;
  padding:48px;
  position:relative;
  overflow-y:auto;
  transform:translateY(20px);
  transition:.3s ease;
}

.popup-overlay.active .popup{
  transform:translateY(0);
}

/* Close button */

.close-popup{
  position:absolute;
  top:20px;
  right:24px;
  border:none;
  background:none;
  font-size:28px;
  cursor:pointer;
  color:black;
}

/* Popup content */

.popup-category{
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#777;
  margin-bottom:12px;
}

.popup-title{
  font-size:clamp(36px,4vw,72px);
  font-weight:300;
  margin-bottom:28px;
}

.popup-description{
  font-size:18px;
  line-height:1.8;
  max-width:700px;
  margin-bottom:36px;
}

.popup-link{
  display:inline-block;
  color:black;
  text-decoration:none;
  border-bottom:1px solid black;
  font-size:18px;
}

.popup-link:hover{
  opacity:0.6;
}

/* Mobile */

@media(max-width:768px){

  .popup{
    width:90vw;
    height:80vh;
    padding:28px;
  }

  .popup-description{
    font-size:16px;
  }
}
</style>
</head>

<script>

/* -----------------------
   HAMBURGER
----------------------- */

const hamburger =
document.getElementById("hamburger");

const menu =
document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};

/* -----------------------
   POPUP
----------------------- */

const popupOverlay =
document.getElementById("popupOverlay");

const popupCategory =
document.getElementById("popupCategory");

const popupTitle =
document.getElementById("popupTitle");

const popupDescription =
document.getElementById("popupDescription");

const popupLink =
document.getElementById("popupLink");

const closePopup =
document.getElementById("closePopup");

/* Open popup */

document.querySelectorAll(".project-card")
.forEach(card => {

  card.addEventListener("click", () => {

    popupCategory.textContent =
      card.dataset.category;

    popupTitle.textContent =
      card.dataset.title;

    popupDescription.textContent =
      card.dataset.description;

    popupLink.href =
      card.dataset.link;

    popupOverlay.classList.add("active");
  });

});

/* Close */

function closeModal(){
  popupOverlay.classList.remove("active");
}

closePopup.addEventListener(
  "click",
  closeModal
);

popupOverlay.addEventListener(
  "click",
  (e)=>{
    if(e.target === popupOverlay){
      closeModal();
    }
  }
);

document.addEventListener(
  "keydown",
  (e)=>{
    if(e.key === "Escape"){
      closeModal();
    }
  }
);

</script>
