<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Minsung Cho</title>

<link rel="stylesheet" href="https://use.typekit.net/rjd5vvx.css">

<style>
body {
  margin: 0;
  background: #181818;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

/* Container */
.container {
  max-width: 900px;
  margin: 120px auto;
  padding: 0 20px;
}

/* Title */
h1 {
  font-size: 20px;
  font-weight: 300;
  margin-bottom: 60px;
}

/* List */
.project-list {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

/* Items */
.project-item {
  font-size: 28px;
  color: #aaa;
  text-decoration: none;
  transition: 0.3s;
}

.project-item:hover {
  color: #fff;
}

/* Hover image */
.hover-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 100;
}

.hover-image img {
  width: 100%;
  display: block;
}

/* Hamburger */
.hamburger {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 35px;
  height: 30px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hamburger div {
  height: 3px;
  background: #fff;
  transition: 0.3s;
}
.hamburger.active div:nth-child(1){
  transform: rotate(45deg) translate(6px,6px);
}
.hamburger.active div:nth-child(2){opacity:0;}
.hamburger.active div:nth-child(3){
  transform: rotate(-45deg) translate(7px,-7px);
}

/* Menu */
.menu {
  position: absolute;
  top: 70px;
  right: 20px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}
.menu.show {
  opacity: 1;
  pointer-events: auto;
}
.menu a {
  color: #fff;
  text-decoration: none;
  margin-bottom: 10px;
}
.menu a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- Hamburger -->
<div class="hamburger" id="hamburger">
  <div></div><div></div><div></div>
</div>

<!-- Menu -->
<div class="menu" id="menu">
  <a href="../../index.html">Home</a>
  <a href="../../pages/about/index.html">About</a>
  <a href="../../pages/contact/index.html">Contact</a>
</div>

<!-- Content -->
<div class="container">
  <h1>Projects</h1>

  <div class="project-list">
    <a href="project1.html" class="project-item" data-img="../imgs/background01.webp">Wallet Saver Map</a>
    <a href="project2.html" class="project-item" data-img="../imgs/background02.webp">Home</a>
    <a href="project3.html" class="project-item" data-img="../imgs/background03.webp">12 Rules of Life</a>
    <a href="project4.html" class="project-item" data-img="../imgs/background04.webp">History of Video Games</a>
    <a href="project5.html" class="project-item" data-img="../imgs/background05.webp">Cole + Ice</a>
    <a href="project6.html" class="project-item" data-img="../imgs/background06.webp">Solar System</a>
    <a href="project7.html" class="project-item" data-img="../imgs/background07.webp">Typeface Archive</a>
    <a href="project8.html" class="project-item" data-img="../imgs/background08.webp">Curvo 2</a>
  </div>
</div>

<!-- Hover Image -->
<div class="hover-image" id="hoverImage">
  <img src="" alt="">
</div>

<script>
/* Hamburger */
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.onclick = () => {
  hamburger.classList.toggle("active");
  menu.classList.toggle("show");
};

/* Hover Image */
const hoverImage = document.getElementById("hoverImage");
const imgTag = hoverImage.querySelector("img");

document.querySelectorAll(".project-item").forEach(item => {

  item.addEventListener("mouseenter", () => {
    imgTag.src = item.dataset.img;
    hoverImage.style.opacity = 1;
  });

  item.addEventListener("mouseleave", () => {
    hoverImage.style.opacity = 0;
  });

  item.addEventListener("mousemove", (e) => {
    hoverImage.style.left = (e.clientX + 20) + "px";
    hoverImage.style.top = (e.clientY + 20) + "px";
  });

});

/* Extra safety: hide if not directly on text */
document.addEventListener("mousemove", (e) => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el || !el.classList.contains("project-item")) {
    hoverImage.style.opacity = 0;
  }
});
</script>

</body>
</html>
